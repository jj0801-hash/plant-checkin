<div class="box">

</div>

<script>
// ===== 核心逻辑（不依赖 DOM，可在 Node 中测试）=====
var DEFAULT_API = 'https://api.github.com';
var API = DEFAULT_API;
var TIMEOUT_MS = 10000;
var THRESH = { successRate: 0.95, readP95: 3000, writeP95: 5000 };

function p95(a) {
  if (!a.length) return null;
  var s = a.slice().sort(function (x, y) { return x - y; });
  return s[Math.min(s.length - 1, Math.ceil(s.length * 0.95) - 1)];

function hdr(tok) {

           'Authorization': 'Bearer ' + tok };

async function timed(url, opt) {
  var c = new AbortController();
  var t = setTimeout(function () { c.abort(); }, TIMEOUT_MS);
  var t0 = performance.now();

    var o = Object.assign({}, opt || {}, { signal: c.signal });

  return timed(API + '/repos/' + owner + '/' + repo + '/contents/', { headers: hdr(tok) });

  var path = 'probe/' + Date.now() + '-' + tag + '.txt';
  var h = Object.assign({ 'Content-Type': 'application/json' }, hdr(tok));
  var r = await timed(API + '/repos/' + owner + '/' + repo + '/contents/' + path,
    { method: 'PUT', headers: h, body: JSON.stringify({ message: 'probe write', content: b64('probe ' + new Date().toISOString()) }) });
  r.path = path;

    var h = Object.assign({ 'Content-Type': 'application/json' }, hdr(tok));
    await timed(API + '/repos/' + owner + '/' + repo + '/contents/' + r.path,
      { method: 'DELETE', headers: h, body: JSON.stringify({ message: 'probe cleanup', sha: r.body.content.sha }) });
  }

var MATRIX = [
  { id: 'KW1', label: '孩子写令牌 写 data-kid', tok: 'kw', repo: 'kid', op: 'write', expect: 'ok' },
  { id: 'KW2', label: '孩子写令牌 写 data-parent', tok: 'kw', repo: 'parent', op: 'write', expect: 'deny' },
  { id: 'KW3', label: '孩子写令牌 读 data-parent', tok: 'kw', repo: 'parent', op: 'read', expect: 'deny' },
  { id: 'KR1', label: '孩子读令牌 读 data-parent', tok: 'kr', repo: 'parent', op: 'read', expect: 'ok' },
  { id: 'KR2', label: '孩子读令牌 写 data-parent', tok: 'kr', repo: 'parent', op: 'write', expect: 'deny' },
  { id: 'KR3', label: '孩子读令牌 写 data-kid', tok: 'kr', repo: 'kid', op: 'write', expect: 'deny' },
  { id: 'KR4', label: '孩子读令牌 读 data-kid', tok: 'kr', repo: 'kid', op: 'read', expect: 'deny' },
  { id: 'P1', label: '家长令牌 读 data-kid', tok: 'p', repo: 'kid', op: 'read', expect: 'ok' },
  { id: 'P2', label: '家长令牌 写 data-kid', tok: 'p', repo: 'kid', op: 'write', expect: 'ok' },
  { id: 'P3', label: '家长令牌 读 data-parent', tok: 'p', repo: 'parent', op: 'read', expect: 'ok' },
  { id: 'P4', label: '家长令牌 写 data-parent', tok: 'p', repo: 'parent', op: 'write', expect: 'ok' }

// 判定：返回 {pass, note}
function judge(expect, op, r) {
  if (r.status === 0) return { pass: false, note: r.error || '网络错误' };
  if (r.status === 401) return { pass: false, note: '令牌无效或已过期(401)' };
  if (expect === 'ok') {
    var good = op === 'write' ? 201 : 200;
    if (r.status === good) return { pass: true, note: '' };
    if (r.status === 404) return { pass: false, note: '404：仓库名/用户名不对，或仓库为空（需要先创建 README）' };
    return { pass: false, note: '状态码 ' + r.status };
  }
  if (r.status === 403 || r.status === 404) return { pass: true, note: '已被拒绝（符合预期）' };

async function runSuite(cfg, rounds, onProgress) {

  var customApi = API !== DEFAULT_API;
  var repos = { kid: cfg.repoKid, parent: cfg.repoParent };
  for (var n = 1; n <= rounds; n++) {
    // 无令牌的基础可达性
    var rl = await timed(API + '/rate_limit', {});
    rows.push({ round: n, id: 'API', label: 'API 根地址（无令牌，跨域）', op: 'read', expect: 'ok',
                status: rl.status, ms: rl.ms, pass: rl.status === 200, note: rl.error || (rl.status === 200 ? '' : '状态码 ' + rl.status) });
    for (var i = 0; i < MATRIX.length; i++) {

      var r = m.op === 'read' ? await ghRead(cfg.owner, repos[m.repo], tok) : await ghWrite(cfg.owner, repos[m.repo], tok, m.id);
      var j = judge(m.expect, m.op, r);
      rows.push({ round: n, id: m.id, label: m.label, op: m.op, expect: m.expect, status: r.status, ms: r.ms, pass: j.pass, note: j.note });
      if (m.op === 'write' && m.expect === 'ok') await ghCleanup(cfg.owner, repos[m.repo], tok, r);
      if (onProgress) onProgress(rows.length);
    }
    var self = await timed(cfg.selfUrl || 'about:blank', {});
    if (cfg.selfUrl) rows.push({ round: n, id: 'SELF', label: '本页所在站点（同源请求）', op: 'read', expect: 'ok',
                                 status: self.status, ms: self.ms, pass: self.status === 200, note: self.error || '' });
    var reach = customApi ? [] : [['https://github.com/', 'github.com'], ['https://gitee.com/', 'gitee.com']];
    if (cfg.sb && !customApi) reach.push([cfg.sb, 'Supabase']);

      catch (e) { okk = false; err = '无法连接'; }
      rows.push({ round: n, id: 'R' + k, label: '可达性：' + reach[k][1], op: 'reach', expect: 'ok',
                  status: okk ? 'ok' : 0, ms: performance.now() - t0, pass: okk, note: err, reach: true });
    }
  }
  return rows;
}
function summarize(rows) {
  var run = rows.filter(function (r) { return !r.skipped; });
  var pass = run.filter(function (r) { return r.pass; }).length;
  var reads = run.filter(function (r) { return r.expect === 'ok' && r.op === 'read' && r.pass; }).map(function (r) { return r.ms; });
  var writes = run.filter(function (r) { return r.expect === 'ok' && r.op === 'write' && r.pass; }).map(function (r) { return r.ms; });
  // 隔离失效：本应被拒绝的操作却成功了（200/201）；网络错误、401 不算
  var denyFail = run.filter(function (r) { return r.expect === 'deny' && (r.status === 200 || r.status === 201); }).length;
  var s = { total: run.length, pass: pass, successRate: run.length ? pass / run.length : 0,
            readP95: p95(reads), writeP95: p95(writes), isolationBroken: denyFail };
  s.okRate = s.successRate >= THRESH.successRate;
  s.okRead = s.readP95 !== null && s.readP95 <= THRESH.readP95;
  s.okWrite = s.writeP95 !== null && s.writeP95 <= THRESH.writeP95;
  s.verdict = s.okRate && s.okRead && s.okWrite && denyFail === 0;
  return s;
}

// ===== 界面（仅浏览器）=====
if (typeof document !== 'undefined') {
  var $ = function (id) { return document.getElementById(id); };
  var HKEY = 'probe_history_v1', TKEY = 'probe_tokens_v1', last = null;
  function cfgFromUi() {
    return { api: $('api').value.trim(), owner: $('owner').value.trim(), repoKid: $('repoKid').value.trim(), repoParent: $('repoParent').value.trim(),
             kw: $('kw').value.trim(), kr: $('kr').value.trim(), p: $('p').value.trim(), sb: $('sb').value.trim(),
             selfUrl: location.protocol.indexOf('http') === 0 ? location.href.split('#')[0] : '' };
  }
  function cell(tr, text, cls) { var td = document.createElement('td'); td.textContent = text; if (cls) td.className = cls; tr.appendChild(td); }
  function renderRows(rows) {
    var t = $('tbl'); t.textContent = '';
    var h = document.createElement('tr'); ['#', '测试', '预期', '状态', '耗时ms', '结果', '说明'].forEach(function (x) { var th = document.createElement('th'); th.textContent = x; h.appendChild(th); }); t.appendChild(h);
    rows.forEach(function (r) {
      var tr = document.createElement('tr');
      cell(tr, r.round); cell(tr, r.label); cell(tr, r.expect === 'deny' ? '应拒绝' : '应成功');
      if (r.skipped) { cell(tr, '-'); cell(tr, '-'); cell(tr, '未填令牌，跳过', 'skip'); cell(tr, ''); }
      else { cell(tr, r.status); cell(tr, Math.round(r.ms)); cell(tr, r.pass ? '通过' : '失败', r.pass ? 'ok' : 'bad'); cell(tr, r.note); }
      t.appendChild(tr);
    });
  }
  function renderSummary(s) {
    var f = function (v) { return v === null ? '无数据' : Math.round(v) + ' ms'; };
    var d = $('summary'); d.textContent = '';
    var pre = document.createElement('pre');

      '读取 P95 ' + f(s.readP95) + ' 标准 ≤3000 ms：' + (s.okRead ? '通过' : '未通过') + '\n' +
      '写入 P95 ' + f(s.writeP95) + ' 标准 ≤5000 ms：' + (s.okWrite ? '通过' : '未通过') + '\n' +
      '权限隔离失效数 ' + s.isolationBroken + '（必须为 0）\n' +
      '本次结论：' + (s.verdict ? '通过' : '未通过') + '（需连续 3 天、两种网络、早中晚都通过才算最终通过）';
    d.appendChild(pre);
  }

    var t = $('hist'); t.textContent = '';
    var h = document.createElement('tr'); ['时间', '网络', '时段', '设备', '成功率', '读P95', '写P95', '隔离', '结论'].forEach(function (x) { var th = document.createElement('th'); th.textContent = x; h.appendChild(th); }); t.appendChild(h);
    loadHist().forEach(function (e) {
      var tr = document.createElement('tr');
      [e.time, e.net, e.period, e.device, (e.summary.successRate * 100).toFixed(1) + '%', e.summary.readP95 === null ? '-' : Math.round(e.summary.readP95), e.summary.writeP95 === null ? '-' : Math.round(e.summary.writeP95), e.summary.isolationBroken === 0 ? '正常' : '失效'].forEach(function (x) { cell(tr, x); });
      cell(tr, e.summary.verdict ? '通过' : '未通过', e.summary.verdict ? 'ok' : 'bad'); t.appendChild(tr);

  $('run').onclick = async function () {
    var cfg = cfgFromUi();

    if ($('remember').checked) localStorage.setItem(TKEY, JSON.stringify({ kw: cfg.kw, kr: cfg.kr, p: cfg.p, owner: cfg.owner }));
    $('run').disabled = true; $('status').textContent = '测试中，请稍候……';

    var rows = await runSuite(cfg, rounds, function (n) { $('status').textContent = '已完成 ' + n + ' 项……'; });
    var s = summarize(rows); renderRows(rows); renderSummary(s);
    last = { time: new Date().toLocaleString(), net: $('net').value, period: $('period').value, device: $('device').value || navigator.userAgent.slice(0, 60), summary: s };

  $('clear').onclick = function () { ['kw', 'kr', 'p'].forEach(function (k) { $(k).value = ''; }); localStorage.removeItem(TKEY); };

}
